openapi: 3.0.3
info:
  title: Stage 2 Search Engine APIs
  version: 1.0.0
servers:
  - url: http://localhost:7003
paths:
  /search:
    get:
      summary: Search indexed books
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: author, in: query, schema: {type: string}}
        - {name: language, in: query, schema: {type: string}}
        - {name: year, in: query, schema: {type: integer}}
        - {name: offset, in: query, schema: {type: integer, default: 0, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, default: 20, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: Search results, including an empty results array when there are no matches
        "400":
          description: Invalid or missing query parameters
        "502":
          description: Indexing service unavailable
  /health:
    get:
      summary: Search service health
      responses:
        "200": {description: Service is running}
